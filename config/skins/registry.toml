[macos]
name = "macOS (WhiteSur Dark)"
description = "macOS Monterey/Ventura look with Plank dock"
category = "modern"
theme_repo = "https://github.com/vinceliuice/WhiteSur-gtk-theme.git"
theme_installer = "install.sh -c Dark -l"
theme_name = "WhiteSur-Dark"
icons_repo = "https://github.com/vinceliuice/WhiteSur-icon-theme.git"
icons_installer = "install.sh -t default"
icons_name = "WhiteSur-dark"
cursor = "WhiteSur-cursors"
buttons = "left"
panel = "top"
font = "SF Pro Display 10"
extras = "plank"

[macos-light]
